name: Backend CI/CD

on:
  push:
    branches:
      - feature/full-stack
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  REGISTRY: 561876735341.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    outputs:
      image-uri: ${{ steps.image.outputs.uri }}
    
    defaults:
      run:
        working-directory: backend/MuchToDo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: private

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build metadata
        id: meta
        run: |
          echo "timestamp=$(date -u +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./backend/MuchToDo
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/starttech-backend:latest
            ${{ env.REGISTRY }}/starttech-backend:${{ github.ref_name }}-${{ steps.meta.outputs.sha_short }}
            ${{ env.REGISTRY }}/starttech-backend:${{ steps.meta.outputs.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image URI
        id: image
        run: |
          echo "uri=${{ env.REGISTRY }}/starttech-backend:latest" >> $GITHUB_OUTPUT

  deploy-ec2-server-1:
    name: Deploy to EC2 Server 1
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Deploy to EC2 Server 1
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_1 }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            
            echo "🔐 Logging into ECR..."
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ env.REGISTRY }}
            
            echo "📦 Pulling latest image..."
            docker pull ${{ needs.build-and-push.outputs.image-uri }}
            
            echo "🛑 Stopping existing container..."
            docker stop backend-server || true
            docker rm backend-server || true
            
            echo "🚀 Starting new container..."
            docker run -d \
              --name backend-server \
              --restart always \
              -p 8080:8080 \
              -e NODE_ENV=production \
              -e LOG_LEVEL=info \
              ${{ needs.build-and-push.outputs.image-uri }}
            
            echo "✅ Deployment to Server 1 completed"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

  deploy-ec2-server-2:
    name: Deploy to EC2 Server 2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Deploy to EC2 Server 2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_2 }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            
            echo "🔐 Logging into ECR..."
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ env.REGISTRY }}
            
            echo "📦 Pulling latest image..."
            docker pull ${{ needs.build-and-push.outputs.image-uri }}
            
            echo "🛑 Stopping existing container..."
            docker stop backend-server || true
            docker rm backend-server || true
            
            echo "🚀 Starting new container..."
            docker run -d \
              --name backend-server \
              --restart always \
              -p 8080:8080 \
              -e NODE_ENV=production \
              -e LOG_LEVEL=info \
              ${{ needs.build-and-push.outputs.image-uri }}
            
            echo "✅ Deployment to Server 2 completed"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

  deployment-status:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-ec2-server-1, deploy-ec2-server-2]
    if: always()
    
    steps:
      - name: Report deployment status
        run: |
          if [ "${{ needs.deploy-ec2-server-1.result }}" == "success" ] && [ "${{ needs.deploy-ec2-server-2.result }}" == "success" ]; then
            echo "✅ All deployments completed successfully!"
            exit 0
          else
            echo "❌ One or more deployments failed"
            exit 1
          fi
