name: Backend CI/CD

on:
  push:
    branches:
      - main
      - feature/full-stack
    paths:
      - 'backend/**'

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/MuchToDo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.ECR_REPOSITORY }}:latest \
            --push \
            --output type=registry \
            .

      - name: Deploy to EC2 Server 1
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_1 }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} |docker login --username AWS --password-stdin 561876735341.dkr.ecr.eu-west-1.amazonaws.com

            docker pull ${{ secrets.ECR_REPOSITORY }}:latest

            docker stop backend || true
            docker rm backend || true

            docker run -d \
            --name backend \
            --restart always \
            --env-file .env \
            -p 8080:8080 \
            ${{ secrets.ECR_REPOSITORY }}:latest

      - name: Deploy to EC2 Server 2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_2 }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin 561876735341.dkr.ecr.eu-west-1.amazonaws.com

            docker pull ${{ secrets.ECR_REPOSITORY }}:latest

            docker stop backend || true
            docker rm backend || true

            docker run -d \
              --name backend \
              --restart always \
              --env-file .env \
              -p 8080:8080 \
              ${{ secrets.ECR_REPOSITORY }}:latest